dependencies:
  espressif/esp32-camera: "~2.1.8"
  espressif/esp-dl: "~3.3.0"
  espressif/yolo26: "~0.1.1"
  espressif/usb_host_uvc: "~2.6.0"
  espressif/human_face_detect: "~0.5.0"
  espressif/human_face_recognition: "~0.3.0"
  espressif/pedestrian_detect: "~0.3.3"
  # holding off on updating mdns as newer versions have higher
  # resource usage
  espressif/mdns: "~1.3.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  idf:
    version: ">=5.3.0"
